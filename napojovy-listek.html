<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Nápojový lístek — MotolMixFusion</title>

<!-- Stranka je zamerne "neviditelna": nikde na webu na ni nevede odkaz,
     neni v navigaci ani v patickce a vyhledavace ji nesmi zaradit. Kdo
     adresu nezna, nenajde ji. Neni to ale zamek - kdo adresu dostane,
     listek si otevre. -->
<meta name="robots" content="noindex, nofollow, noarchive">

<link rel="stylesheet" href="style2.css">
<style>
  /* Vzhled si bere style2.css, aby listek vypadal jako restauracni menu
     a pri zmene stylu webu se nerozesel. Tady je jen to, co navic. */
  .menu2-list li { align-items: center; }
  .napoje-stav { padding: 20px 0; opacity: .6; }

  /* Klikaci nazev - stejne chovani jako u jidel na restauracnim menu */
  .napoj-trigger {
    background: none; border: none; padding: 0; margin: 0; font: inherit;
    color: inherit; cursor: pointer; text-align: left;
    text-decoration: underline; text-decoration-style: dotted;
    text-underline-offset: 3px;
  }
  .napoj-trigger:hover { opacity: .65; }

  /* Detail napoje */
  .napoj-overlay {
    position: fixed; inset: 0; background: rgba(20,16,12,.55);
    z-index: 900;
  }
  .napoj-popup {
    position: fixed; z-index: 901; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(440px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
    overflow: auto; background: #fff; border-radius: 16px;
    padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .napoj-popup h3 { margin: 0 0 4px; font-size: 19px; }
  .napoj-popup .meta { font-size: 13px; opacity: .65; margin-bottom: 14px; }
  .napoj-popup img {
    width: 100%; max-height: 300px; object-fit: contain;
    border-radius: 10px; margin-bottom: 14px; background: #f3efe8;
  }
  .napoj-popup p.popis { font-size: 14px; line-height: 1.6; margin: 0 0 18px; }
  .napoj-akce { display: flex; gap: 10px; flex-wrap: wrap; }
  .napoj-akce a, .napoj-akce button {
    flex: 1; min-width: 150px; text-align: center; border: none; cursor: pointer;
    padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: 700;
    font-family: inherit; text-decoration: none;
  }
  .napoj-akce .hlavni { background: #c9713f; color: #fff; }
  .napoj-akce .vedlejsi { background: #efe9e0; color: #4a443c; }

  @media print {
    /* style2.css schovava pri tisku vsechny sekce krome #menu2 - tahle
       stranka ma vlastni sekci, tak si ji musi vratit zpatky. */
    .dept2#napoje { display: block !important; }
    .napoj-overlay, .napoj-popup { display: none !important; }
    .napoj-trigger { text-decoration: none; }
  }
</style>
</head>
<body>

<main>
  <section class="dept2" id="napoje">
    <div class="wrap2">
      <div class="print-head" aria-hidden="true">
        <span class="print-name">MotolMixFusion</span>
        <span class="print-date" id="printDate"></span>
      </div>

      <div class="dept2-head">
        <div>
          <span class="dept2-num">NÁPOJE</span>
          <h2>Nápojový lístek</h2>
          <p class="note2">Pivo z lokálních pivovarů, vína vybraná sommelierem
            a italské speciality z přímého dovozu — všechno pořádně vychlazené.
            Zařídíme i VIP posezení pro větší společnost.
            💡 Klikněte na nápoj pro fotku a podrobnosti.</p>
        </div>
      </div>

      <div class="board2" id="napoje-board">
        <p class="napoje-stav">Načítám nápojový lístek…</p>
      </div>
    </div>
  </section>
</main>

<div class="napoj-overlay" id="napojOverlay" hidden></div>
<div class="napoj-popup" id="napojPopup" hidden role="dialog" aria-modal="true">
  <h3 id="napojNazev"></h3>
  <div class="meta" id="napojMeta"></div>
  <img id="napojFoto" alt="" hidden>
  <p class="popis" id="napojPopis"></p>
  <div class="napoj-akce">
    <a class="hlavni" id="napojPoptavka" href="#">Poptat větší množství</a>
    <button class="vedlejsi" type="button" id="napojZavrit">Zavřít</button>
  </div>
</div>

<script>
// Listek se tahne z pokladny, aby se ceny neudrzovaly na dvou mistech.
// Co se prepise v adminu, je tady po obnoveni stranky.
const API = 'https://motolmixfusion-pos.onrender.com';
const EMAIL = 'info@motolmixfusion.cz';   // stejna adresa jako u poptavky cateringu

const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

const objem = l => l == null ? '' : String(l).replace('.', ',') + ' l';

let NAPOJE = [];   // vsechny polozky, aby se detail nasel podle indexu

function otevri(i) {
  const p = NAPOJE[i];
  if (!p) return;
  document.getElementById('napojNazev').textContent = p.name;
  document.getElementById('napojMeta').textContent =
    [p.volume_l ? objem(p.volume_l) : '', Math.round(p.price_czk) + ' Kč']
      .filter(Boolean).join(' · ');

  const foto = document.getElementById('napojFoto');
  foto.hidden = !p.photo;
  if (p.photo) foto.src = p.photo;

  const popis = document.getElementById('napojPopis');
  popis.textContent = p.description || '';
  popis.hidden = !p.description;

  // Poptavka odchazi mailem, stejne jako catering - zadny server k tomu
  // netreba a rovnou je v ni videt, o ktery napoj jde.
  document.getElementById('napojPoptavka').href =
    'mailto:' + EMAIL +
    '?subject=' + encodeURIComponent('Poptávka většího množství: ' + p.name) +
    '&body=' + encodeURIComponent(
      'Dobrý den,\n\nmám zájem o větší množství: ' + p.name +
      (p.volume_l ? ' (' + objem(p.volume_l) + ')' : '') + '.\n\n' +
      'Počet kusů: \nTermín: \n\nDěkuji.\n');

  document.getElementById('napojOverlay').hidden = false;
  document.getElementById('napojPopup').hidden = false;
}

function zavri() {
  document.getElementById('napojOverlay').hidden = true;
  document.getElementById('napojPopup').hidden = true;
}

function radek(p, i) {
  // Fotka je jen v detailu - v radku by ze seznamu udelala vylohu
  // a listek by se prestal cist jako listek.
  return '<li>' +
    '<button type="button" class="napoj-trigger" data-i="' + i + '">' + esc(p.name) + '</button>' +
    (p.volume_l ? '<span class="g2">' + esc(objem(p.volume_l)) + '</span>' : '') +
    '<span class="dots2"></span>' +
    '<span class="price2">' + Math.round(p.price_czk) + ' Kč</span>' +
    '</li>';
}

(async () => {
  const box = document.getElementById('napoje-board');
  let data;
  try {
    data = await fetch(API + '/api/public/napoje').then(r => r.json());
  } catch (e) {
    box.innerHTML = '<p class="napoje-stav">Nápojový lístek se teď nepodařilo načíst. ' +
      'Zkuste stránku obnovit za chvilku.</p>';
    return;
  }
  if (!Array.isArray(data) || !data.length) {
    box.innerHTML = '<p class="napoje-stav">Nápojový lístek se připravuje.</p>';
    return;
  }

  data.forEach(s => s.polozky.forEach(p => { p._i = NAPOJE.push(p) - 1; }));

  const vina = data.filter(s => s.kategorie === 'Víno');
  const ostatni = data.filter(s => s.kategorie !== 'Víno');
  const sekce = s => '<h3 class="mt2">' + esc(s.kategorie) + '</h3>' +
    '<ul class="menu2-list">' + s.polozky.map(p => radek(p, p._i)).join('') + '</ul>';

  box.innerHTML =
    '<div class="board2-col">' + ostatni.map(sekce).join('') + '</div>' +
    (vina.length ? '<div class="menu2-wines">' +
      vina.map(s => '<h3>' + esc(s.kategorie) + '</h3>' +
        '<ul class="menu2-list">' + s.polozky.map(p => radek(p, p._i)).join('') + '</ul>').join('') +
      '</div>' : '');

  box.querySelectorAll('.napoj-trigger').forEach(b =>
    b.addEventListener('click', () => otevri(Number(b.dataset.i))));

  const d = document.getElementById('printDate');
  if (d) d.textContent = new Date().toLocaleDateString('cs-CZ',
    { day: 'numeric', month: 'long', year: 'numeric' });
})();

document.getElementById('napojZavrit').addEventListener('click', zavri);
document.getElementById('napojOverlay').addEventListener('click', zavri);
document.getElementById('napojPoptavka').addEventListener('click', zavri);
document.addEventListener('keydown', e => { if (e.key === 'Escape') zavri(); });
</script>
</body>
</html>
