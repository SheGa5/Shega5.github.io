<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Akce a události — MotolMixFusion</title>
<meta name="description" content="Fotky a videa z akcí v MotolMixFusion.">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------- galerie akcí ---------- */
  .akce-intro { padding: 32px 0 8px; }
  .akce-intro h1 { font-family: var(--font-display); font-size: clamp(28px, 4vw, 40px); margin: 0 0 8px; color: var(--ink); }
  .akce-intro p { margin: 0; color: rgba(58, 52, 44, 0.75); }

  .event { margin: 36px 0; }
  .event-head {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    border-bottom: 2px solid var(--teal); padding-bottom: 8px; margin-bottom: 8px;
  }
  .event-title { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--terracotta); }
  .event-date {
    font-size: 12px; font-weight: 700; color: rgba(58, 52, 44, 0.75);
    background: rgba(75, 124, 114, 0.14); padding: 3px 10px; border-radius: 20px; white-space: nowrap;
  }
  .event-desc { font-size: 15px; line-height: 1.6; margin: 0 0 14px; white-space: pre-line; }
  .event-count { font-size: 12px; color: rgba(58, 52, 44, 0.65); margin-bottom: 14px; }

  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  @media (max-width: 560px) { .gallery { grid-template-columns: 1fr 1fr; gap: 8px; } }

  .tile {
    position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line); background: var(--cream-panel);
    cursor: pointer; padding: 0; width: 100%; display: block;
  }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.25s; }
  .tile:hover img, .tile:hover video { transform: scale(1.04); }
  .tile .play-badge {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(43, 38, 32, 0.28); color: #fff; font-size: 34px; pointer-events: none;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }
  .tile .yt-label {
    position: absolute; left: 8px; bottom: 8px; background: rgba(43, 38, 32, 0.8); color: #fff;
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px; padding: 3px 8px; border-radius: 20px;
    pointer-events: none;
  }

  .akce-note {
    text-align: center; font-size: 15px; line-height: 1.7; color: rgba(58, 52, 44, 0.75);
    background: #fff; border: 1px dashed var(--line); border-radius: 12px; padding: 40px 24px; margin: 24px 0 40px;
  }
  .akce-note code { background: rgba(75, 124, 114, 0.12); padding: 2px 6px; border-radius: 5px; font-size: 13px; color: var(--ink); }

  /* ---------- lightbox ---------- */
  .lightbox {
    position: fixed; inset: 0; background: rgba(20, 17, 14, 0.94);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .lightbox.show { display: flex; }
  .lightbox img, .lightbox video, .lightbox iframe { max-width: 100%; max-height: 82vh; border-radius: 10px; background: #000; }
  .lightbox iframe { width: min(960px, 100%); aspect-ratio: 16 / 9; height: auto; border: 0; }
  .lb-close, .lb-nav {
    position: absolute; background: rgba(255, 255, 255, 0.14); color: #fff; border: none;
    border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .lb-close { top: 16px; right: 16px; width: 44px; height: 44px; font-size: 24px; }
  .lb-nav { top: 50%; transform: translateY(-50%); width: 50px; height: 50px; font-size: 26px; }
  .lb-prev { left: 14px; }
  .lb-next { right: 14px; }
  .lb-caption { position: absolute; bottom: 18px; left: 0; right: 0; text-align: center; color: rgba(255, 255, 255, 0.75); font-size: 12px; padding: 0 20px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-inner">
    <div class="logo">MOTOL<span>MIX</span>FUSION</div>
    <nav class="topnav">
      <details class="nav-dropdown">
        <summary data-i18n="nav.menu">Menu</summary>
        <div class="nav-dropdown-list">
          <a href="index.html#menu" data-i18n="nav.menuGo">Jídelníček to GO</a>
          <a href="index2.html#menu2" data-i18n="nav.menuRestaurant">Restaurační menu</a>
        </div>
      </details>
      <a href="index.html#objednat" data-i18n="nav.order">Objednat</a>
      <a href="index.html#kde" data-i18n="nav.location">Kde nás najdete</a>
      <a href="index.html#kontakt" data-i18n="nav.contact">Kontakt</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="akce-intro">
      <h1>Akce a události</h1>
      <p>Fotky a videa z toho, co se u nás dělo.</p>
    </div>
    <div id="events">
      <p class="akce-note">Načítám…</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span data-i18n="footer.rights">© 2026 MotolMixFusion · Kudrnova 234/6, Praha 5</span>
    <a href="index.html" class="footer-eve-link">Zpět na hlavní stránku →</a>
  </div>
</footer>

<div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
  <button class="lb-close" onclick="closeLightbox()" aria-label="Zavřít">✕</button>
  <button class="lb-nav lb-prev" onclick="event.stopPropagation();navLightbox(-1)" aria-label="Předchozí">‹</button>
  <div id="lightboxBody"></div>
  <button class="lb-nav lb-next" onclick="event.stopPropagation();navLightbox(1)" aria-label="Další">›</button>
  <div class="lb-caption" id="lightboxCaption"></div>
</div>

<script src="akce.js"></script>
<script>
  // Fotky i videa jsou v tomhle repu ve slozce images/akce/<RRRR-MM-DD_nazev>/
  initAkce({
    repo: 'SheGa5/Shega5.github.io',

    base: 'images/akce/'
  });
</script>
</body>
</html>
